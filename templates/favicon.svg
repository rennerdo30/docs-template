<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Luminous Void">
  <title>Luminous Void</title>
  <rect width="32" height="32" rx="7" fill="#0a0a0f"/>
  <!-- The void: an open orange ring with a cyan point of light inside. -->
  <circle cx="16" cy="16" r="8.5" fill="none" stroke="#f97316" stroke-width="2.5"
          stroke-linecap="round" stroke-dasharray="40 13" transform="rotate(-45 16 16)"/>
  <circle cx="16" cy="16" r="3" fill="#22d3ee"/>
</svg>
